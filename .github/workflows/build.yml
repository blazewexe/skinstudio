name: Build Skin Studio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Save JAR as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: skin-studio-1.21.1
          path: |
            build/libs/skin-studio-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
